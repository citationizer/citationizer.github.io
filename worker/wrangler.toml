name = "citationizer"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Your GitHub Pages address (origin only, no path). Several can be listed, separated by commas,
# for example "https://citationizer.github.io,http://localhost:3000".
ALLOWED_ORIGIN = "https://citationizer.github.io"
# Free Cloudflare Workers AI model. Swap for another text model from the Workers AI catalog.
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
AI_MAX_TOKENS = "8000"
# Visitor limits, counted per IP address: USE_LIMIT formats per WINDOW_HOURS hours,
# and FETCH_LIMIT page fetches in the same window.
USE_LIMIT = "3"
WINDOW_HOURS = "4"
FETCH_LIMIT = "20"

# Gives the Worker access to Cloudflare Workers AI. No API key needed.
[ai]
binding = "AI"

# The usage counter (one small record per visitor).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Optional secret, set with wrangler, not here. It is the owner's bypass: anyone who types it
# under "Owner access code" on the site skips the limit.
#   npx wrangler secret put ACCESS_CODE
#
# To use Claude instead of Workers AI, set PROVIDER = "anthropic" above and run:
#   npx wrangler secret put ANTHROPIC_API_KEY
